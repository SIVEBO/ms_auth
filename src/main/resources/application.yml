spring:
  application:
    name: ms_auth
  profiles:
    active: dev
  datasource:
    url: jdbc:mariadb://localhost:3306/db_ms_auth?createDatabaseIfNotExist=true
    username: root
    password:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format:
          sql: true

server:
  port: 8086

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: wzO3r4PadzwqMhgV7h3GgvIrkopVoaIj3GvNZb7M3x4=
  expiration-ms: 3600000
