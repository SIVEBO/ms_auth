spring:
  application:
    name: ms_admision
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/db_ms_admision?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format:
          sql: true

server:
  port: ${SERVER_PORT:8087}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

ms:
  clientes:
    url: ${MS_CLIENTES_URL:http://localhost:8085}
  sucursales:
    url: ${MS_SUCURSALES_URL:http://localhost:8083}
  auth:
    url: ${MS_AUTH_URL:http://localhost:8086}
  tracking:
    url: ${MS_TRACKING_URL:http://localhost:8093}
